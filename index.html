<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Parking Spot at UB (Hochstetter Lot)</title>
  <!-- NES.css Retro Framework -->
  <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a24;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 900px;
      max-width: 98vw;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #212529;
      padding: 12px 20px;
      border: 4px solid #fff;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    canvas {
      background: #343a40;
      border: 4px solid #fff;
      box-shadow: 0 8px 0 #000;
      border-radius: 4px;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      height: 520px;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    .btn-action {
      margin-top: 20px;
      font-size: 14px !important;
      padding: 10px 20px !important;
    }
    .controls-hint {
      margin-top: 8px;
      font-size: 10px;
      color: #aaa;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div class="hud-item"><span>LOT:</span> <span id="lot-name" style="color:#00bc8c;">Hochstetter A</span></div>
    <div class="hud-item"><span>COINS:</span> <span id="coin-count" style="color:#f39c12;">0 🪙</span></div>
    <div class="hud-item"><span>LEVEL:</span> <span id="level-num" style="color:#375a7f;">1</span></div>
  </div>

  <canvas id="gameCanvas" width="900" height="520"></canvas>

  <div id="overlay">
    <h1 id="overlay-title" style="color:#e74c3c; margin-bottom: 15px; font-size: 20px;">HOCHSTETTER RUSH</h1>
    <p id="overlay-msg" style="font-size: 11px; line-height: 1.8; max-width: 80%;">
      Race against rival UB students for open horizontal parking spots!<br>
      Use <b>ARROW KEYS</b> or <b>WASD</b> to steer, accelerate, & reverse.
    </p>
    <button id="start-btn" class="nes-btn is-primary btn-action" onclick="startGame()">START DRIVING</button>
  </div>

  <div class="controls-hint">
    [W/UP] Gas | [S/DOWN] Reverse | [A/LEFT & D/RIGHT] Steer
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// HUD & Overlay UI
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayMsg = document.getElementById('overlay-msg');
const startBtn = document.getElementById('start-btn');
const coinDisplay = document.getElementById('coin-count');
const levelDisplay = document.getElementById('level-num');

// Audio Synthesizer (Web Audio API)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'park') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'stolen') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }
}

// Game State
let gameState = 'START'; // START, PLAYING, GAMEOVER
let coins = 0;
let level = 1;
let openSpot = null;

// Controls
const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };
window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

// Player Car
const player = {
  x: 450,
  y: 470,
  width: 36,
  height: 20,
  angle: 0,
  speed: 0,
  maxSpeed: 3.5,
  accel: 0.12,
  friction: 0.95,
  color: '#e74c3c'
};

// Horizontal Parking Spots Layout (Hochstetter A Grid)
const spots = [];
function buildLot() {
  spots.length = 0;
  // Left Grid Rows (Horizontal Spots)
  for (let r = 0; r < 5; r++) {
    for (let side = 0; side < 2; side++) {
      spots.push({
        x: side === 0 ? 90 : 250,
        y: 90 + r * 70,
        w: 60,
        h: 30,
        occupied: Math.random() > 0.3,
        occupiedColor: '#7f8c8d',
        isTarget: false
      });
    }
  }
  // Right Grid Rows (Horizontal Spots)
  for (let r = 0; r < 5; r++) {
    for (let side = 0; side < 2; side++) {
      spots.push({
        x: side === 0 ? 570 : 730,
        y: 90 + r * 70,
        w: 60,
        h: 30,
        occupied: Math.random() > 0.3,
        occupiedColor: '#7f8c8d',
        isTarget: false
      });
    }
  }

  // Pick one guaranteed open spot as the target spot
  const emptySpots = spots.filter(s => !s.occupied);
  if (emptySpots.length > 0) {
    openSpot = emptySpots[Math.floor(Math.random() * emptySpots.length)];
    openSpot.isTarget = true;
  }
}

// AI Rivals
let rival = {
  x: 100,
  y: 470,
  speed: 1.8,
  color: '#3498db'
};

function resetRound() {
  player.x = 450;
  player.y = 470;
  player.angle = 0;
  player.speed = 0;

  // Change player car color per level
  const colors = ['#e74c3c', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22'];
  player.color = colors[(level - 1) % colors.length];

  rival.x = Math.random() > 0.5 ? 80 : 800;
  rival.y = 470;
  rival.speed = 1.5 + level * 0.3; // Rivals get faster each level

  buildLot();
}

function startGame() {
  if (!audioCtx) audioCtx = new AudioContext();
  gameState = 'PLAYING';
  overlay.style.display = 'none';
  resetRound();
  requestAnimationFrame(gameLoop);
}

function update() {
  if (gameState !== 'PLAYING') return;

  // Steering & Acceleration
  const pressingGas = keys.ArrowUp || keys.w;
  const pressingRev = keys.ArrowDown || keys.s;
  const pressingLeft = keys.ArrowLeft || keys.a;
  const pressingRight = keys.ArrowRight || keys.d;

  if (pressingGas) player.speed = Math.min(player.maxSpeed, player.speed + player.accel);
  else if (pressingRev) player.speed = Math.max(-player.maxSpeed * 0.5, player.speed - player.accel);
  else player.speed *= player.friction;

  if (Math.abs(player.speed) > 0.1) {
    const dir = player.speed > 0 ? 1 : -1;
    if (pressingLeft) player.angle -= 0.05 * dir;
    if (pressingRight) player.angle += 0.05 * dir;
  }

  player.x += Math.cos(player.angle) * player.speed;
  player.y += Math.sin(player.angle) * player.speed;

  // Boundaries
  player.x = Math.max(20, Math.min(880, player.x));
  player.y = Math.max(20, Math.min(500, player.y));

  // AI Rival Movement toward Open Target Spot
  if (openSpot) {
    const targetX = openSpot.x + openSpot.w / 2;
    const targetY = openSpot.y + openSpot.h / 2;
    const dx = targetX - rival.x;
    const dy = targetY - rival.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 5) {
      rival.x += (dx / dist) * rival.speed;
      rival.y += (dy / dist) * rival.speed;
    } else {
      // Rival stole the spot!
      playSound('stolen');
      endRound(false);
      return;
    }

    // Check Player Arrival in Target Spot
    const pDist = Math.hypot(targetX - player.x, targetY - player.y);
    if (pDist < 25) {
      // Player successfully parked!
      coins += 50;
      level++;
      coinDisplay.textContent = `${coins} 🪙`;
      levelDisplay.textContent = level;
      playSound('park');
      endRound(true);
      return;
    }
  }
}

function endRound(won) {
  gameState = 'GAMEOVER';
  overlay.style.display = 'flex';
  if (won) {
    overlayTitle.textContent = "SPOT SECURED! +50 COINS";
    overlayTitle.style.color = "#2ecc71";
    overlayMsg.innerHTML = `You beat the rival student to Hochstetter Lot!<br>Ready to move to <b>Level ${level}</b>?`;
    startBtn.textContent = "NEXT LOT";
  } else {
    overlayTitle.textContent = "SPOT STOLEN!";
    overlayTitle.style.color = "#e74c3c";
    overlayMsg.innerHTML = `A rival student took the last open spot.<br>Total Coins Collected: <b>${coins}</b>`;
    startBtn.textContent = "TRY AGAIN";
    level = 1;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw Roads & Lanes (Hochstetter A Map Layout)
  ctx.fillStyle = '#495057';
  ctx.fillRect(40, 40, 820, 440);

  // Draw Parking Lines & Spots
  spots.forEach(s => {
    ctx.strokeStyle = s.isTarget ? '#2ecc71' : '#ffffff';
    ctx.lineWidth = s.isTarget ? 3 : 1;
    ctx.strokeRect(s.x, s.y, s.w, s.h);

    if (s.occupied) {
      ctx.fillStyle = s.occupiedColor;
      ctx.fillRect(s.x + 5, s.y + 4, s.w - 10, s.h - 8);
    } else if (s.isTarget) {
      ctx.fillStyle = 'rgba(46, 204, 113, 0.3)';
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = '#2ecc71';
      ctx.font = '8px "Press Start 2P"';
      ctx.fillText("OPEN", s.x + 12, s.y + 18);
    }
  });

  // Draw Rival Car
  ctx.fillStyle = rival.color;
  ctx.fillRect(rival.x - 15, rival.y - 10, 30, 20);
  ctx.fillStyle = '#fff';
  ctx.font = '7px "Press Start 2P"';
  ctx.fillText("RIVAL", rival.x - 14, rival.y - 14);

  // Draw Player Car (Rotated)
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);
  ctx.fillStyle = player.color;
  ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
  // Windshield
  ctx.fillStyle = '#333';
  ctx.fillRect(2, -8, 8, 16);
  ctx.restore();
}

function gameLoop() {
  if (gameState === 'PLAYING') {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }
}

draw();
</script>
</body>
</html>

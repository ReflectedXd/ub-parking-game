<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hochstetter Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12131a;
    --panel: #1c1e2b;
    --panel-2: #252838;
    --line: #3a3f58;
    --text: #f3f4f8;
    --muted: #8b90a8;
    --accent: #ff5c5c;
    --gold: #ffc83d;
    --green: #38e07b;
    --blue: #4cc9f0;
    --pixel: 'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #1d2033 0, var(--bg) 60%);
    color: var(--text);
    font-family: var(--pixel);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }
  #app {
    width: min(920px, 100%);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Header */
  header { display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 14px; letter-spacing: 1px; }
  header h1 span { color: var(--accent); }
  #level-val {
    background: var(--panel-2);
    border: 2px solid var(--line);
    padding: 6px 10px;
    font-size: 10px;
    color: var(--blue);
  }

  /* HUD */
  #hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat {
    background: var(--panel);
    border: 2px solid var(--line);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .label { font-size: 8px; color: var(--muted); }
  .val { font-size: 16px; white-space: nowrap; }
  .gold { color: var(--gold); }
  .bar { height: 5px; background: #0e0f15; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--blue); }
  #combo-fill { background: var(--green); width: 0; }
  .stat.danger .val { color: var(--accent); animation: blink .5s steps(2) infinite; }
  .stat.danger .bar i { background: var(--accent); }
  @keyframes blink { 50% { opacity: .4; } }

  /* Stage */
  #stage {
    position: relative;
    width: 100%;
    aspect-ratio: 900 / 520;
    border: 3px solid var(--line);
    background: #000;
    box-shadow: 0 6px 0 #000;
  }
  canvas { width: 100%; height: 100%; display: block; }

  /* Overlay card */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 11, 18, .78);
    padding: 16px;
  }
  #overlay.hidden { display: none; }
  .card {
    background: var(--panel);
    border: 3px solid var(--line);
    padding: 24px 28px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow: 0 6px 0 #000;
  }
  .card h2 { margin: 0 0 14px; font-size: 20px; line-height: 1.3; color: var(--gold); }
  .card p { margin: 0 0 18px; font-size: 10px; line-height: 1.9; color: #cfd2e3; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .stats div { background: var(--panel-2); padding: 10px 6px; font-size: 8px; color: var(--muted); }
  .stats b { display: block; margin-top: 8px; font-size: 14px; color: var(--text); }
  .btn {
    font-family: var(--pixel);
    font-size: 13px;
    color: #12131a;
    background: var(--gold);
    border: 0;
    padding: 14px 22px;
    cursor: pointer;
    box-shadow: 0 4px 0 #b88a0c;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b88a0c; }

  /* Key legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    font-size: 8px;
    color: var(--muted);
  }
  .legend kbd {
    font-family: inherit;
    background: var(--panel-2);
    border: 2px solid var(--line);
    padding: 4px 6px;
    color: var(--text);
    margin-right: 4px;
  }

  /* Touch controls (phones/tablets only) */
  #touch { display: none; justify-content: space-between; gap: 12px; touch-action: none; }
  .pad { display: flex; gap: 8px; }
  #touch button {
    font-family: var(--pixel);
    font-size: 10px;
    color: var(--text);
    background: var(--panel-2);
    border: 2px solid var(--line);
    padding: 18px 14px;
    min-width: 62px;
    touch-action: none;
    box-shadow: 0 3px 0 #000;
  }
  #touch button.on { background: var(--line); }
  @media (pointer: coarse) {
    #touch { display: flex; }
    .legend { display: none; }
  }
  @media (max-width: 640px) {
    .val { font-size: 12px; }
    .stat { padding: 8px; }
    #hud { gap: 6px; }
    header h1 { font-size: 11px; }
    .card { padding: 16px; }
    .card h2 { font-size: 14px; }
    .card p { font-size: 8px; }
    .btn { font-size: 11px; padding: 12px 16px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>HOCHSTETTER <span>RUSH</span></h1>
    <span id="level-val">LVL 1</span>
  </header>

  <div id="hud">
    <div class="stat" id="time-stat">
      <span class="label">TIME</span>
      <span class="val" id="time-val">60</span>
      <div class="bar"><i id="time-fill"></i></div>
    </div>
    <div class="stat">
      <span class="label">COINS</span>
      <span class="val gold" id="coin-val">0</span>
    </div>
    <div class="stat">
      <span class="label">COMBO</span>
      <span class="val" id="combo-val">x1</span>
      <div class="bar"><i id="combo-fill"></i></div>
    </div>
    <div class="stat">
      <span class="label">BEST</span>
      <span class="val" id="best-val">0</span>
    </div>
  </div>

  <div id="stage">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <div class="card">
        <h2 id="ov-title">HOCHSTETTER RUSH</h2>
        <p id="ov-msg">Grab open spots before rivals do. Park inside the glowing P, hold it for a split second and cash in. Chain parks for combo multipliers. Every park adds time.</p>
        <div class="stats" id="ov-stats" style="display:none">
          <div>COINS<b id="st-coins">0</b></div>
          <div>PARKS<b id="st-parks">0</b></div>
          <div>BEST<b id="st-best">0</b></div>
        </div>
        <button class="btn" id="start-btn">START ENGINE</button>
      </div>
    </div>
  </div>

  <div class="legend">
    <span><kbd>W</kbd><kbd>&uarr;</kbd>Gas</span>
    <span><kbd>S</kbd><kbd>&darr;</kbd>Reverse</span>
    <span><kbd>A</kbd><kbd>D</kbd>Steer</span>
    <span><kbd>SPACE</kbd>Brake</span>
  </div>

  <div id="touch">
    <div class="pad">
      <button data-k="left">&#9664;</button>
      <button data-k="right">&#9654;</button>
    </div>
    <div class="pad">
      <button data-k="brake">BRAKE</button>
      <button data-k="down">REV</button>
      <button data-k="up">GAS</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ---------- Setup ---------- */
const W = 900, H = 520;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * dpr;
canvas.height = H * dpr;

const $ = id => document.getElementById(id);
const overlay = $('overlay'), ovTitle = $('ov-title'), ovMsg = $('ov-msg'), ovStats = $('ov-stats');
const startBtn = $('start-btn');
const timeVal = $('time-val'), timeFill = $('time-fill'), timeStat = $('time-stat');
const coinVal = $('coin-val'), comboVal = $('combo-val'), comboFill = $('combo-fill');
const bestVal = $('best-val'), levelVal = $('level-val');

/* ---------- Tuning ---------- */
const CAR_W = 44, CAR_H = 22;
const SPOT_W = 64, SPOT_H = 38, ROWS = 10, TOP = 24;
const LANE_Y = 464;
const COLS = [
  { x: 49,  face: 1 },
  { x: 207, face: -1 },
  { x: 629, face: 1 },
  { x: 787, face: -1 }
];
const ROUND_TIME = 60;     // seconds on the clock (also the cap)
const TIME_BONUS = 3;      // seconds gained per park
const HOLD_TIME = 0.22;    // seconds you must sit in a spot to cash in
const COMBO_WINDOW = 9;    // seconds to chain the next park
const MAX_SPEED = 5.2, ACCEL = 0.26, DRAG = 0.965;
const PLAYER_COLOR = '#ff4d4d';
const PARKED_COLORS = ['#7f8c8d', '#95a5a6', '#5d6d7e', '#a29b8d', '#6c7a89', '#8e9aaf', '#b0a8a0'];
const RIVAL_COLORS = ['#4cc9f0', '#b388ff', '#ff9f43', '#2ee6c5'];

/* ---------- Helpers ---------- */
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function rr(g, x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
}

/* ---------- Audio ---------- */
let audioCtx = null;
function beep(freq, dur, type = 'square', vol = 0.1, slideTo) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  coin()   { beep(880, 0.08, 'square', 0.1); setTimeout(() => beep(1320, 0.15, 'square', 0.1), 70); },
  stolen() { beep(220, 0.3, 'sawtooth', 0.12, 90); },
  bump()   { beep(120, 0.08, 'square', 0.08); },
  tick()   { beep(660, 0.06, 'square', 0.06); },
  over()   { beep(300, 0.6, 'triangle', 0.15, 70); }
};

/* ---------- State ---------- */
let state = 'START';       // START | PLAYING | PARKED | OVER
let coins = 0, level = 1, combo = 0, comboTimer = 0, parks = 0;
let timeLeft = ROUND_TIME, roundTime = 0, parkedTimer = 0, freeTimer = 1.5;
let best = Number(safeGet('hochstetterRushBest')) || 0;
let shake = 0, lastSec = 0, lastBump = 0, overStamp = 0;
let spots = [], rivals = [], particles = [], texts = [];

const player = { x: 450, y: 480, angle: 0, speed: 0 };
const input = { up: false, down: false, left: false, right: false, brake: false };

/* ---------- Lot layout ---------- */
function layoutSpots() {
  const out = [];
  COLS.forEach(c => {
    for (let r = 0; r < ROWS; r++) {
      out.push({
        x: c.x, y: TOP + r * SPOT_H, w: SPOT_W, h: SPOT_H,
        face: c.face,
        aisle: c.face === 1 ? c.x + SPOT_W + 47 : c.x - 47,
        occupied: true, color: '#777', angle: 0, flash: 0, hold: 0
      });
    }
  });
  return out;
}

function buildLot() {
  spots = layoutSpots();
  spots.forEach(s => { s.color = pick(PARKED_COLORS); s.angle = pick([0, Math.PI]); });
  const openCount = Math.max(4, 7 - Math.floor(level / 2));
  shuffle(spots.slice()).slice(0, openCount).forEach(s => { s.occupied = false; });
}

/* Pre-rendered static background */
const bg = document.createElement('canvas');
bg.width = W * dpr; bg.height = H * dpr;
function renderBg() {
  const g = bg.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#2b2e3b';
  g.fillRect(0, 0, W, H);
  for (let i = 0; i < 600; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.025)' : 'rgba(0,0,0,.07)';
    g.fillRect(Math.random() * W, Math.random() * H, 2, 2);
  }
  // Painted lot name down the middle
  g.save();
  g.translate(450, H / 2 - 30);
  g.rotate(-Math.PI / 2);
  g.fillStyle = 'rgba(255,255,255,.07)';
  g.font = '22px "Press Start 2P", monospace';
  g.textAlign = 'center';
  g.fillText('HOCHSTETTER A', 0, 0);
  g.restore();
  // Aisle + lane markings
  g.setLineDash([14, 12]);
  g.lineWidth = 2;
  g.strokeStyle = 'rgba(255,214,102,.35)';
  [160, 740].forEach(x => { g.beginPath(); g.moveTo(x, TOP); g.lineTo(x, TOP + ROWS * SPOT_H); g.stroke(); });
  g.strokeStyle = 'rgba(255,255,255,.14)';
  g.beginPath(); g.moveTo(20, LANE_Y); g.lineTo(W - 20, LANE_Y); g.stroke();
  g.setLineDash([]);
  // Bay lines
  g.strokeStyle = 'rgba(255,255,255,.55)';
  g.lineWidth = 2;
  layoutSpots().forEach(s => {
    g.beginPath();
    g.moveTo(s.x, s.y); g.lineTo(s.x + s.w, s.y);
    g.moveTo(s.x, s.y + s.h); g.lineTo(s.x + s.w, s.y + s.h);
    const bx = s.face === 1 ? s.x : s.x + s.w;
    g.moveTo(bx, s.y); g.lineTo(bx, s.y + s.h);
    g.stroke();
  });
  // Curb
  g.strokeStyle = '#4a4f66';
  g.lineWidth = 8;
  g.strokeRect(4, 4, W - 8, H - 8);
}
renderBg();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderBg);

/* ---------- Rivals ---------- */
function placeRivalOffscreen(r) {
  const left = Math.random() < 0.5;
  r.x = left ? -40 : W + 40;
  r.y = LANE_Y;
  r.angle = left ? 0 : Math.PI;
  r.target = null;
  r.path = [];
}
function makeRival(delay) {
  const r = { color: pick(RIVAL_COLORS), wait: delay, target: null, path: [] };
  placeRivalOffscreen(r);
  return r;
}
function planPath(r) {
  const s = r.target;
  const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
  const pts = [];
  if (Math.abs(r.x - s.aisle) < 8) {
    pts.push({ x: s.aisle, y: cy });
  } else {
    if (r.y < LANE_Y - 6) pts.push({ x: r.x, y: LANE_Y });
    pts.push({ x: s.aisle, y: LANE_Y }, { x: s.aisle, y: cy });
  }
  pts.push({ x: cx, y: cy });
  r.path = pts;
}
function pickTarget(r) {
  const opens = spots
    .filter(s => !s.occupied && !rivals.some(o => o !== r && o.target === s))
    .sort((a, b) => dist(r.x, r.y, a.x, a.y) - dist(r.x, r.y, b.x, b.y));
  if (!opens.length) { r.target = null; return; }
  r.target = (Math.random() < 0.25 && opens.length > 1) ? opens[1] : opens[0];
  planPath(r);
}
function rivalParks(r) {
  const s = r.target;
  if (s && !s.occupied) {
    s.occupied = true;
    s.color = r.color;
    s.angle = Math.cos(r.angle) >= 0 ? 0 : Math.PI;
    s.flash = 1;
    s.hold = 0;
    const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
    if (dist(cx, cy, player.x, player.y) < 240) {
      sfx.stolen();
      floatText(cx, cy - 4, 'TAKEN!', '#ff6b6b', 10);
    }
  }
  placeRivalOffscreen(r);
  r.wait = 1.2 + Math.random() * 1.2;
}

/* ---------- Effects ---------- */
function burst(x, y) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, g: 0.12, life: 0.75, max: 0.75, size: 4, color: '#ffc83d', coin: true });
  }
}
function puff(x, y) {
  for (let i = 0; i < 7; i++) {
    const a = Math.random() * Math.PI * 2, sp = 0.6 + Math.random() * 1.2;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0, life: 0.5, max: 0.5, size: 5, color: '#aab0c4', coin: false });
  }
}
function floatText(x, y, text, color, size) {
  texts.push({ x, y, text, color, size: size || 12, life: 1 });
}
function updateFx(dt, k) {
  particles.forEach(p => { p.x += p.vx * k; p.y += p.vy * k; p.vy += p.g * k; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
  texts.forEach(t => { t.y -= 32 * dt; t.life -= dt; });
  texts = texts.filter(t => t.life > 0);
}

/* ---------- Round control ---------- */
function resetRound() {
  player.x = 450; player.y = 480; player.angle = 0; player.speed = 0;
  roundTime = 0;
  buildLot();
  const n = Math.min(4, 1 + Math.floor(level / 2));
  rivals = Array.from({ length: n }, (_, i) => makeRival(0.4 + i * 0.9));
  freeTimer = 1.5;
}

function startGame() {
  if (state === 'PLAYING' || state === 'PARKED') return;
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  coins = 0; level = 1; combo = 0; comboTimer = 0; parks = 0;
  timeLeft = ROUND_TIME; lastSec = 0;
  particles = []; texts = [];
  overlay.classList.add('hidden');
  resetRound();
  state = 'PLAYING';
  updateHud();
}

function showOverlay(title, msg, showStats, btn) {
  ovTitle.textContent = title;
  ovMsg.textContent = msg;
  ovStats.style.display = showStats ? 'grid' : 'none';
  if (showStats) {
    $('st-coins').textContent = coins.toLocaleString();
    $('st-parks').textContent = parks;
    $('st-best').textContent = best.toLocaleString();
  }
  startBtn.textContent = btn;
  overlay.classList.remove('hidden');
}

function endGame() {
  state = 'OVER';
  timeLeft = 0;
  overStamp = performance.now();
  const isBest = coins > best;
  if (isBest) { best = coins; safeSet('hochstetterRushBest', String(best)); }
  sfx.over();
  updateHud();
  showOverlay(
    isBest ? 'NEW BEST!' : "TIME'S UP!",
    isBest ? 'New high score. Think you can beat it?' : 'The lot is full. Run it back and chase a bigger combo.',
    true, 'DRIVE AGAIN'
  );
}

function parkSuccess(s) {
  const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
  combo = comboTimer > 0 ? Math.min(5, combo + 1) : 1;
  comboTimer = COMBO_WINDOW;
  const speedBonus = Math.max(0, Math.round(8 - roundTime)) * 2;
  const gain = (10 + speedBonus) * combo;
  coins += gain;
  parks++;
  timeLeft = Math.min(ROUND_TIME, timeLeft + TIME_BONUS);

  s.occupied = true;
  s.color = PLAYER_COLOR;
  s.angle = Math.cos(player.angle) >= 0 ? 0 : Math.PI;
  s.flash = 1; s.hold = 0;
  player.x = cx; player.y = cy; player.speed = 0; player.angle = s.angle;

  burst(cx, cy);
  floatText(cx, cy - 22, '+' + gain, '#ffc83d', 14);
  if (combo > 1) floatText(cx, cy - 44, 'COMBO x' + combo, '#4cc9f0', 10);
  floatText(cx, cy + 24, '+' + TIME_BONUS + 's', '#38e07b', 10);
  sfx.coin();

  if (parks % 3 === 0) {
    level++;
    floatText(W / 2, H / 2, 'LEVEL ' + level, '#ff9f43', 20);
  }
  state = 'PARKED';
  parkedTimer = 0.5;
}

/* ---------- HUD ---------- */
function updateHud() {
  timeVal.textContent = Math.max(0, Math.ceil(timeLeft));
  timeFill.style.width = Math.max(0, timeLeft / ROUND_TIME * 100) + '%';
  timeStat.classList.toggle('danger', state === 'PLAYING' && timeLeft < 10);
  coinVal.textContent = coins.toLocaleString();
  comboVal.textContent = 'x' + Math.max(1, combo);
  comboFill.style.width = (comboTimer / COMBO_WINDOW * 100) + '%';
  bestVal.textContent = best.toLocaleString();
  levelVal.textContent = 'LVL ' + level;
}

/* ---------- Update ---------- */
function bump() {
  const now = performance.now();
  if (now - lastBump > 250) { sfx.bump(); lastBump = now; }
  shake = Math.max(shake, 3);
}

function update(dt) {
  const k = dt * 60;
  updateFx(dt, k);
  spots.forEach(s => { if (s.flash > 0) s.flash = Math.max(0, s.flash - dt * 2.2); });
  shake *= Math.pow(0.85, k);

  if (state === 'PARKED') {
    parkedTimer -= dt;
    if (parkedTimer <= 0) { resetRound(); state = 'PLAYING'; }
    updateHud();
    return;
  }
  if (state !== 'PLAYING') return;

  /* Clock + combo */
  timeLeft -= dt;
  roundTime += dt;
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) { comboTimer = 0; combo = 0; }
  }
  if (timeLeft <= 0) { endGame(); return; }
  const sec = Math.ceil(timeLeft);
  if (sec !== lastSec) { lastSec = sec; if (sec <= 5) sfx.tick(); }

  /* Player physics */
  const p = player;
  if (input.up) p.speed = Math.min(MAX_SPEED, p.speed + ACCEL * k);
  else if (input.down) p.speed = Math.max(-MAX_SPEED * 0.5, p.speed - ACCEL * (p.speed > 0 ? 2.4 : 1) * k);
  else p.speed *= Math.pow(DRAG, k);
  if (input.brake) p.speed *= Math.pow(0.84, k);

  if (Math.abs(p.speed) > 0.15) {
    const dir = p.speed > 0 ? 1 : -1;
    const turn = 0.075 * Math.min(1, Math.abs(p.speed) / 2.2) * k;
    if (input.left) p.angle -= turn * dir;
    if (input.right) p.angle += turn * dir;
  }
  p.x += Math.cos(p.angle) * p.speed * k;
  p.y += Math.sin(p.angle) * p.speed * k;

  const minX = CAR_W / 2 + 4, maxX = W - CAR_W / 2 - 4;
  const minY = CAR_H / 2 + 4, maxY = H - CAR_H / 2 - 4;
  if (p.x < minX || p.x > maxX || p.y < minY || p.y > maxY) {
    p.x = Math.max(minX, Math.min(maxX, p.x));
    p.y = Math.max(minY, Math.min(maxY, p.y));
    if (Math.abs(p.speed) > 2) bump();
    p.speed *= 0.6;
  }

  /* Spots: bump into parked cars, park in open ones */
  const aligned = Math.abs(Math.sin(p.angle)) < 0.42;
  let parkSpot = null;
  for (const s of spots) {
    if (s.occupied) {
      if (p.x > s.x + 4 && p.x < s.x + s.w - 4 && p.y > s.y + 3 && p.y < s.y + s.h - 3) {
        p.speed *= Math.pow(0.72, k);
        if (Math.abs(p.speed) > 1.5) bump();
      }
      continue;
    }
    const inside = p.x > s.x + 14 && p.x < s.x + s.w - 14 && p.y > s.y + 7 && p.y < s.y + s.h - 7;
    if (inside && aligned) {
      p.speed *= Math.pow(0.88, k);               // parking assist
      if (Math.abs(p.speed) < 2.2) {
        s.hold += dt;
        if (s.hold >= HOLD_TIME && !parkSpot) parkSpot = s;
      }
    } else {
      s.hold = Math.max(0, s.hold - dt * 2);
    }
  }
  if (parkSpot) { parkSuccess(parkSpot); updateHud(); return; }

  /* Rivals */
  const rSpeed = Math.min(4.6, 2.3 + level * 0.25);
  for (const r of rivals) {
    if (r.wait > 0) { r.wait -= dt; continue; }
    if (!r.target || r.target.occupied) {
      pickTarget(r);
      if (!r.target) { r.wait = 0.3; continue; }
    }
    const wp = r.path[0];
    if (!wp) { rivalParks(r); continue; }
    const dx = wp.x - r.x, dy = wp.y - r.y;
    const d = Math.hypot(dx, dy), step = rSpeed * k;
    if (d <= step) {
      r.x = wp.x; r.y = wp.y;
      r.path.shift();
      if (!r.path.length) rivalParks(r);
    } else {
      r.x += dx / d * step;
      r.y += dy / d * step;
      r.angle = Math.atan2(dy, dx);
    }
  }

  /* Cars pulling out keep the lot churning */
  freeTimer -= dt;
  if (freeTimer <= 0) {
    const openNow = spots.filter(s => !s.occupied).length;
    if (openNow < 3 || (openNow < 8 && Math.random() < 0.5)) {
      const cands = spots.filter(s => s.occupied &&
        !(Math.abs(p.x - (s.x + s.w / 2)) < 40 && Math.abs(p.y - (s.y + s.h / 2)) < 30));
      if (cands.length) {
        const s = pick(cands);
        s.occupied = false; s.flash = 1; s.hold = 0;
        puff(s.x + s.w / 2, s.y + s.h / 2);
      }
    }
    freeTimer = 1.3 + Math.random() * 1.2;
  }

  updateHud();
}

/* ---------- Drawing ---------- */
function drawCar(x, y, a, color, me) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  rr(ctx, -CAR_W / 2 + 2, -CAR_H / 2 + 3, CAR_W, CAR_H, 5); ctx.fill();
  // Wheels
  ctx.fillStyle = '#101117';
  [-12, 12].forEach(wx => {
    ctx.fillRect(wx - 5, -CAR_H / 2 - 2, 10, 3);
    ctx.fillRect(wx - 5, CAR_H / 2 - 1, 10, 3);
  });
  // Body
  ctx.fillStyle = color;
  rr(ctx, -CAR_W / 2, -CAR_H / 2, CAR_W, CAR_H, 5); ctx.fill();
  // Cabin
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  rr(ctx, -8, -CAR_H / 2 + 3, 16, CAR_H - 6, 3); ctx.fill();
  // Windows
  ctx.fillStyle = '#bfe9ff';
  ctx.fillRect(8, -CAR_H / 2 + 3, 5, CAR_H - 6);
  ctx.fillStyle = 'rgba(191,233,255,.55)';
  ctx.fillRect(-13, -CAR_H / 2 + 3, 3, CAR_H - 6);
  // Lights
  ctx.fillStyle = '#fff6b0';
  ctx.fillRect(CAR_W / 2 - 3, -CAR_H / 2 + 2, 3, 4);
  ctx.fillRect(CAR_W / 2 - 3, CAR_H / 2 - 6, 3, 4);
  ctx.fillStyle = '#ff3b3b';
  ctx.fillRect(-CAR_W / 2, -CAR_H / 2 + 2, 2, 4);
  ctx.fillRect(-CAR_W / 2, CAR_H / 2 - 6, 2, 4);
  if (me) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    rr(ctx, -CAR_W / 2, -CAR_H / 2, CAR_W, CAR_H, 5); ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const t = performance.now() / 1000;

  // Spots
  spots.forEach(s => {
    if (!s.occupied) {
      const pulse = 0.5 + 0.5 * Math.sin(t * 6 + s.y);
      ctx.fillStyle = 'rgba(56,224,123,' + (0.14 + 0.12 * pulse) + ')';
      ctx.fillRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
      ctx.strokeStyle = 'rgba(56,224,123,' + (0.6 + 0.4 * pulse) + ')';
      ctx.lineWidth = 2;
      ctx.strokeRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
      ctx.fillStyle = 'rgba(56,224,123,.85)';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText('P', s.x + s.w / 2, s.y + s.h / 2 + 1);
      if (s.hold > 0) {
        ctx.fillStyle = '#ffc83d';
        ctx.fillRect(s.x + 4, s.y + s.h - 7, (s.w - 8) * Math.min(1, s.hold / HOLD_TIME), 4);
      }
    } else {
      drawCar(s.x + s.w / 2, s.y + s.h / 2, s.angle, s.color, false);
    }
    if (s.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (s.flash * 0.5) + ')';
      ctx.fillRect(s.x, s.y, s.w, s.h);
    }
  });

  // Rivals
  rivals.forEach(r => { if (r.wait <= 0) drawCar(r.x, r.y, r.angle, r.color, false); });

  // Player (already shown as the parked car during the PARKED beat)
  if (state !== 'PARKED') drawCar(player.x, player.y, player.angle, PLAYER_COLOR, true);

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    if (p.coin) {
      ctx.strokeStyle = '#b88a0c'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;

  // Floating text
  texts.forEach(tx => {
    ctx.globalAlpha = Math.min(1, tx.life * 1.6);
    ctx.font = tx.size + 'px "Press Start 2P", monospace';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000';
    ctx.strokeText(tx.text, tx.x, tx.y);
    ctx.fillStyle = tx.color;
    ctx.fillText(tx.text, tx.x, tx.y);
  });
  ctx.globalAlpha = 1;
}

/* ---------- Loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

/* ---------- Input ---------- */
const keyMap = {
  arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down',
  arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', ' ': 'brake'
};
function canStartNow() {
  return (state === 'START' || state === 'OVER') && performance.now() - overStamp > 700;
}
window.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if ((key === 'enter' || key === ' ') && (state === 'START' || state === 'OVER')) {
    e.preventDefault();
    if (canStartNow()) startGame();
    return;
  }
  const act = keyMap[key];
  if (act) { input[act] = true; e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  const act = keyMap[e.key.toLowerCase()];
  if (act) input[act] = false;
});
window.addEventListener('blur', () => { for (const k in input) input[k] = false; });
startBtn.addEventListener('click', () => { if (canStartNow()) startGame(); });

// Touch buttons
document.querySelectorAll('#touch button').forEach(btn => {
  const k = btn.dataset.k;
  const on = e => { e.preventDefault(); input[k] = true; btn.classList.add('on'); };
  const off = () => { input[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('pointerleave', off);
});

/* ---------- Boot ---------- */
resetRound();
updateHud();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
